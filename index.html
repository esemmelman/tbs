<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ee">
  <title>My Links</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="menu-title">
    <div class="topline"><span class="brand">MY LINKS</span><span class="dot" aria-hidden="true"></span></div>
    <button class="back" id="back" hidden>← All categories</button>
    <p class="eyebrow" id="eyebrow">A LITTLE SHORTCUT</p>
    <h1 id="menu-title" tabindex="-1">Where to?</h1>
    <p class="description" id="description">Choose a category to find your next stop.</p>
    <nav id="menu" aria-label="Categories"></nav>
    <p class="footer" id="footer">Your everyday destinations, in one place.</p>
  </main>
</body>
</html>
